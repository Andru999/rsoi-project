name: Build & Deploy to Minikube

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  deploy:
    name: Full Deploy
    runs-on: self-hosted             # ваш локальный раннер
    steps:
      # 1. Получаем код
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Переключаем Docker CLI на демон Minikube
      - name: Switch to Minikube Docker daemon
        run: |
          & minikube -p minikube docker-env --shell powershell | Invoke-Expression
        shell: powershell

      # 3. Сборка образов бэкенда
      - name: Build backend images
        run: |
          cd backend
          docker compose build
        shell: powershell

      # 4. Сборка образа фронтенда
      - name: Build frontend image
        run: |
          cd frontend
          docker compose build
        shell: powershell

#      # 5. Установка / обновление Kafka (Bitnami-чарт).
#      #    Если Kafka уже стоит – можно закомментировать этот шаг.
#      - name: Deploy Kafka
#        run: |
#          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
#          helm upgrade --install kafka bitnami/kafka `
#            --set zookeeper.enabled=true `
#            --set listeners.client.protocol=PLAINTEXT `
#            --set advertisedListeners.client.protocol=PLAINTEXT `
#            --wait --timeout 10m
#        shell: powershell

      # 6. Создание ConfigMap с SQL-скриптами инициализации БД
      #    Имена ConfigMap должны совпадать с теми, что ожидает postgres-chart.
      - name: Create init-sql ConfigMaps
        run: |
          kubectl create configmap bonusdb-init-sql --from-file=backend/bonus_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap flightdb-init-sql --from-file=backend/flight_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap ticketdb-init-sql --from-file=backend/ticket_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap authdb-init-sql --from-file=backend/auth_service/sql/init_db.sql --dry-run=client -o yaml | kubectl apply -f -
        shell: powershell

      # 7. Деплой баз данных через postgres-chart
      - name: Deploy PostgreSQL databases
        run: |
          helm upgrade --install db ./k8s/postgres-chart `
            -f ./k8s/postgres-chart/values.yaml `
            --wait --timeout 5m
        shell: powershell

      # 8. Деплой микросервисов и фронтенда через app-chart
      - name: Deploy application services
        run: |
          helm upgrade --install my-app ./k8s/app-chart `
            -f ./k8s/app-chart/values.yaml `
            --wait --timeout 15m
        shell: powershell

      # 9. Запуск minikube tunnel в фоне, чтобы Ingress отвечал на localhost
      - name: Start minikube tunnel
        run: |
          Start-Process -NoNewWindow powershell -ArgumentList "minikube tunnel"
          Start-Sleep -Seconds 15
        shell: powershell

      # 10. Ожидание, пока все поды станут Ready
      - name: Wait for all pods
        run: kubectl wait --for=condition=ready pod --all --timeout=300s
        shell: powershell

#      # 11. Прогон API-тестов (предполагается, что скрипт лежит в ./scripts)
#      - name: Run API tests
#        timeout-minutes: 5
#        run: bash ./scripts/test-script.sh
#        shell: bash
#        env:
#          VARIANT: v1
#          BASE_URL: http://localhost
#          # Если тестовый скрипт требует конкретного имени деплоймента:
#          DEPLOYMENT_NAME: my-app-bonus-service
#          NAMESPACE: default