apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controller
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # 1. API-пути, где нужен rewrite (не /api и не /)
          {{- range $key, $val := .Values.services }}
          {{- $pub := $val.publishUrl }}
          {{- if and (ne $pub "/") (ne $pub "/api") (ne $pub "") }}
          {{- $path := trimSuffix "/" $pub }}
          - path: {{ (printf "%s(/|$)(.*)" $path) | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- end }}
          {{- end }}
          # 2. Путь /api без rewrite (gateway)
          {{- range $key, $val := .Values.services }}
          {{- if eq $val.publishUrl "/api" }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- end }}
          {{- end }}
          # 3. Корневой путь без rewrite (SPA)
          {{- range $key, $val := .Values.services }}
          {{- if eq $val.publishUrl "/" }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- end }}
          {{- end }}