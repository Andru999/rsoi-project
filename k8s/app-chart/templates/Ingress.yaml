apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controller
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          {{- range $key, $val := .Values.services }}
          {{- if (hasKey $val "publishUrl") }}
          {{- $path := trimSuffix "/" $val.publishUrl }}
          {{- if eq $path "/" }}
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- else }}
          - path: {{ (printf "%s(/|$)(.*)" $path) | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- end }}
          {{- end }}
          {{- end }}