apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: controller
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          {{- range $key, $val := .Values.services }}
          {{- if and (hasKey $val "publishUrl") (ne $val.publishUrl "") }}
          {{- $pub := $val.publishUrl }}
          {{- if eq $pub "/" }}
          # Корневой путь для SPA – захватываем всё
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- else }}
          {{- $path := trimSuffix "/" $pub }}
          # Префикс + необязательный "/" + остаток пути
          - path: {{ (printf "%s(/|$)(.*)" $path) | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $val.name }}
                port:
                  number: {{ $val.port }}
          {{- end }}
          {{- end }}
          {{- end }}